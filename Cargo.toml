[package]
name = "mik32-pac"
version = "1.1.0"
edition = "2024"
authors = ['Alex Newlifer', 'Aleksandr Novozhilov']
categories = ["embedded", "hardware-support", "no-std"]
description = "Peripheral access crate for the MIK32 Amur (К1948ВК018) RISC-V microcontroller"
keywords = ["riscv", "mik32", "pac"]
license = "MIT"
repository = "https://github.com/Newlifer/mik32-pac"

[dependencies]
riscv = "0.16.1"
vcell = "0.1.3"

[dependencies.riscv-rt]
version = "0.18.0"
optional = true

[dependencies.critical-section]
version = "1.2.0"
optional = true

[features]
default = ["critical-section"]
critical-section = ["dep:critical-section"]
rt = ["riscv-rt"]
rts = ["rt", "riscv-rt/s-mode"]
all = ["critical-section", "rts"]
